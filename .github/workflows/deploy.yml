name: Echo Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release target (separate Supabase and Vercel projects)
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: echo-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require environment secrets
        shell: bash
        run: |
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "Missing environment secret: $key"
              exit 1
            fi
          done
      - name: Install Vercel CLI
        run: npm install --global vercel
      - name: Pull target project environment
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build before backend changes
        run: vercel build --prod --token "$VERCEL_TOKEN"
      - name: Link target database
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview migrations
        run: npm run supabase:analysis:check
      - name: Deploy compatible worker, then migrations
        run: npm run supabase:analysis:deploy
      - name: Publish application
        run: vercel deploy --prebuilt --prod --non-interactive --token "$VERCEL_TOKEN"
